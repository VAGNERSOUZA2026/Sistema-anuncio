<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Anúncios</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      color: white;
      font-family: Arial, sans-serif;
      width: 100vw;
      height: 100vh;
      overflow: hidden;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .player {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    h1 {
      font-size: 60px;
    }

    p {
      font-size: 28px;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <div class="player">
    <div>
      <h1>📺 Sistema de Anúncios</h1>
      <p>Player funcionando!</p>
    </div>
  </div>

</body>
</html>
