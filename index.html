<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Player de Anúncios</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  background: black;
  overflow: hidden;
}

#anuncio {
  width: 100vw;
  height: 100vh;
  object-fit: contain;
  display: block;
}
</style>
</head>

<body>

<img id="anuncio" src="file_0000000096a48208947fff63e416a78d.png">

<script>

const anuncios = [
  "file_0000000096a48208947fff63e416a78d.png",
  "file_00000000fda88210b6fc11d93c25ec5b.png"
];

let atual = 0;

setInterval(() => {

  atual++;

  if (atual >= anuncios.length) {
    atual = 0;
  }

  document.getElementById("anuncio").src = anuncios[atual];

}, 5000);

</script>

</body>
</html>
