<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Painel - Sistema de Anúncios</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #101114;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  background: #191b20;
  padding: 22px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 25px;
}

header p {
  color: #999;
  margin-bottom: 0;
}

main {
  padding: 20px;
  max-width: 700px;
  margin: auto;
}

.card {
  background: #1c1f24;
  padding: 20px;
  border-radius: 14px;
  margin-bottom: 15px;
}

.card h2 {
  margin-top: 0;
  font-size: 20px;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 8px;
  border: 0;
  border-radius: 9px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.azul {
  background: #2979ff;
  color: white;
}

.verde {
  background: #00a86b;
  color: white;
}

.cinza {
  background: #343840;
  color: white;
}

.status {
  color: #4ade80;
  font-weight: bold;
}

/* LISTA DE ANÚNCIOS */

#listaAnuncios {
  display: none;
  margin-top: 15px;
}

.anuncio-item {
  background: #101114;
  padding: 15px;
  border-radius: 10px;
  margin-top: 10px;
  border: 1px solid #343840;
}

.anuncio-item strong {
  font-size: 18px;
}

.anuncio-item p {
  margin: 8px 0;
  color: #ccc;
}

.ativo {
  color: #4ade80 !important;
}

.inativo {
  color: #ff6b6b !important;
}
</style>
</head>

<body>

<header>
  <h1>📺 Sistema de Anúncios</h1>
  <p>Painel Administrativo</p>
</header>

<main>

  <!-- PLAYER -->

  <div class="card">
    <h2>🖥️ Player</h2>

    <p class="status">
      ● Online
    </p>

    <button
      class="verde"
      onclick="window.open('index.html','_blank')">
      Abrir Player
    </button>

  </div>


  <!-- ANÚNCIOS -->

  <div class="card">

    <h2>📢 Anúncios</h2>

    <button class="azul">
      ➕ Adicionar anúncio
    </button>

    <button
      class="cinza"
      onclick="mostrarAnuncios()">
      📂 Meus anúncios
    </button>

    <div id="listaAnuncios"></div>

  </div>


  <!-- PLAYLIST -->

  <div class="card">

    <h2>📋 Playlist</h2>

    <button class="cinza">
      Gerenciar Playlist
    </button>

  </div>


  <!-- TELAS -->

  <div class="card">

    <h2>🖥️ Telas</h2>

    <button class="cinza">
      Gerenciar TVs
    </button>

  </div>


  <!-- PROGRAMAÇÃO -->

  <div class="card">

    <h2>🕐 Programação</h2>

    <button class="cinza">
      Definir horários
    </button>

  </div>

</main>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
'https://brqdnhqifzlqktxvvltb.supabase.co';

const SUPABASE_KEY =
'COLE_AQUI_SUA_PUBLISHABLE_KEY';

const db =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* CARREGAR ANÚNCIOS */

async function carregarAnunciosPainel() {

  const { data, error } =
    await db
      .from('anuncios')
      .select('*')
      .order(
        'created_at',
        { ascending: false }
      );

  if (error) {

    console.error(
      'Erro ao carregar anúncios:',
      error
    );

    return [];
  }

  return data || [];
}


/* MOSTRAR ANÚNCIOS */

async function mostrarAnuncios() {

  const lista =
    document.getElementById(
      'listaAnuncios'
    );

  /*
  Se a lista estiver aberta,
  fecha ao clicar novamente.
  */

  if (
    lista.style.display === 'block'
  ) {

    lista.style.display = 'none';

    return;
  }


  lista.innerHTML =
    '<p>Carregando anúncios...</p>';

  lista.style.display = 'block';


  const anuncios =
    await carregarAnunciosPainel();


  lista.innerHTML = '';


  if (anuncios.length === 0) {

    lista.innerHTML =
      '<p>Nenhum anúncio cadastrado.</p>';

    return;
  }


  anuncios.forEach(anuncio => {

    const card =
      document.createElement('div');

    card.className =
      'anuncio-item';


    /* NOME */

    const nome =
      document.createElement('strong');

    nome.textContent =
      anuncio.nome ||
      'Anúncio sem nome';


    /* TIPO */

    const tipo =
      document.createElement('p');

    tipo.textContent =
      'Tipo: ' +
      (anuncio.tipo || '-');


    /* DURAÇÃO */

    const duracao =
      document.createElement('p');

    if (anuncio.duracao) {

      duracao.textContent =
        'Duração: ' +
        (anuncio.duracao / 1000) +
        ' segundos';

    } else {

      duracao.textContent =
        'Duração: -';

    }


    /* STATUS */

    const status =
      document.createElement('p');

    if (anuncio.ativo) {

      status.textContent =
        '● Status: Ativo';

      status.className =
        'ativo';

    } else {

      status.textContent =
        '● Status: Inativo';

      status.className =
        'inativo';

    }


    /* ADICIONAR AO CARD */

    card.appendChild(nome);
    card.appendChild(tipo);
    card.appendChild(duracao);
    card.appendChild(status);


    /* ADICIONAR À LISTA */

    lista.appendChild(card);

  });

}

</script>

</body>
</html>
