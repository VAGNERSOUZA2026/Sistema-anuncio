<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Painel - Sistema de Anúncios</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #101114;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  background: #191b20;
  padding: 22px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 25px;
}

header p {
  color: #999;
  margin-bottom: 0;
}

main {
  padding: 20px;
  max-width: 700px;
  margin: auto;
}

.card {
  background: #1c1f24;
  padding: 20px;
  border-radius: 14px;
  margin-bottom: 15px;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 8px;
  border: 0;
  border-radius: 9px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.azul {
  background: #2979ff;
  color: white;
}

.verde {
  background: #00a86b;
  color: white;
}

.cinza {
  background: #343840;
  color: white;
}

.status {
  color: #4ade80;
  font-weight: bold;
}

input {
  width: 100%;
  padding: 13px;
  margin-top: 8px;
  margin-bottom: 12px;
  border-radius: 8px;
  border: 1px solid #444;
  background: #101114;
  color: white;
}

label {
  display: block;
  margin-top: 10px;
}

#formAnuncio {
  display: none;
  margin-top: 15px;
  padding: 15px;
  border-radius: 10px;
  background: #101114;
}

#listaAnuncios {
  display: none;
  margin-top: 15px;
}

.anuncio-item {
  background: #101114;
  padding: 15px;
  border-radius: 10px;
  margin-top: 10px;
  border: 1px solid #343840;
}

.ativo {
  color: #4ade80;
}

#mensagem {
  margin-top: 12px;
  font-weight: bold;
}
</style>
</head>

<body>

<header>
  <h1>📺 Sistema de Anúncios</h1>
  <p>Painel Administrativo</p>
</header>

<main>

<div class="card">

  <h2>🖥️ Player</h2>

  <p class="status">
    ● Online
  </p>

  <button
    class="verde"
    onclick="window.open('index.html','_blank')">
    Abrir Player
  </button>

</div>


<div class="card">

  <h2>📢 Anúncios</h2>

  <button
    class="azul"
    onclick="abrirFormulario()">
    ➕ Adicionar anúncio
  </button>


  <div id="formAnuncio">

    <label>Nome do anúncio</label>

    <input
      type="text"
      id="nomeAnuncio"
      placeholder="Ex: Promoção de sábado">


    <label>Imagem ou vídeo</label>

    <input
      type="file"
      id="arquivoAnuncio"
      accept="image/*,video/*">


    <label>
      Duração da imagem em segundos
    </label>

    <input
      type="number"
      id="duracaoAnuncio"
      value="5"
      min="1">


    <button
      class="verde"
      onclick="salvarAnuncio()">
      Salvar anúncio
    </button>

    <button
      class="cinza"
      onclick="fecharFormulario()">
      Cancelar
    </button>

    <div id="mensagem"></div>

  </div>


  <button
    class="cinza"
    onclick="mostrarAnuncios()">
    📂 Meus anúncios
  </button>

  <div id="listaAnuncios"></div>

</div>


<div class="card">

  <h2>📋 Playlist</h2>

  <button class="cinza">
    Gerenciar Playlist
  </button>

</div>


<div class="card">

  <h2>🖥️ Telas</h2>

  <button class="cinza">
    Gerenciar TVs
  </button>

</div>


<div class="card">

  <h2>🕐 Programação</h2>

  <button class="cinza">
    Definir horários
  </button>

</div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
'https://brqdnhqifzlqktxvvltb.supabase.co';

const SUPABASE_KEY =
'COLE_AQUI_A_MESMA_PUBLISHABLE_KEY';

const db =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* ABRIR FORMULÁRIO */

function abrirFormulario() {

  document
    .getElementById('formAnuncio')
    .style.display = 'block';

}


/* FECHAR FORMULÁRIO */

function fecharFormulario() {

  document
    .getElementById('formAnuncio')
    .style.display = 'none';

}


/* SALVAR ANÚNCIO */

async function salvarAnuncio() {

  const nome =
    document
      .getElementById('nomeAnuncio')
      .value.trim();

  const arquivo =
    document
      .getElementById('arquivoAnuncio')
      .files[0];

  const duracao =
    document
      .getElementById('duracaoAnuncio')
      .value;

  const mensagem =
    document
      .getElementById('mensagem');


  if (!nome) {

    mensagem.textContent =
      'Digite o nome do anúncio.';

    return;
  }


  if (!arquivo) {

    mensagem.textContent =
      'Escolha uma imagem ou vídeo.';

    return;
  }


  mensagem.textContent =
    'Enviando arquivo...';


  let tipo = 'imagem';

  if (
    arquivo.type.startsWith('video/')
  ) {

    tipo = 'video';

  }


  const nomeLimpo =
    arquivo.name
      .replace(/[^a-zA-Z0-9._-]/g, '_');


  const nomeArquivo =
    Date.now() +
    '_' +
    nomeLimpo;


  /* UPLOAD PARA STORAGE */

  const {
    error: erroUpload
  } =
    await db
      .storage
      .from('midias')
      .upload(
        nomeArquivo,
        arquivo
      );


  if (erroUpload) {

    console.error(erroUpload);

    mensagem.textContent =
      'Erro ao enviar arquivo.';

    return;
  }


  /* PEGAR URL PÚBLICA */

  const {
    data: dadosUrl
  } =
    db
      .storage
      .from('midias')
      .getPublicUrl(nomeArquivo);


  const urlArquivo =
    dadosUrl.publicUrl;


  /* SALVAR NO BANCO */

  let duracaoFinal = null;

  if (tipo === 'imagem') {

    duracaoFinal =
      Number(duracao) * 1000;

  }


  const {
    error: erroBanco
  } =
    await db
      .from('anuncios')
      .insert([
        {
          nome: nome,
          tipo: tipo,
          arquivo: urlArquivo,
          duracao: duracaoFinal,
          ativo: true
        }
      ]);


  if (erroBanco) {

    console.error(erroBanco);

    mensagem.textContent =
      'Arquivo enviado, mas houve erro ao cadastrar o anúncio.';

    return;
  }


  mensagem.textContent =
    '✅ Anúncio cadastrado com sucesso!';


  document
    .getElementById('nomeAnuncio')
    .value = '';


  document
    .getElementById('arquivoAnuncio')
    .value = '';


  document
    .getElementById('duracaoAnuncio')
    .value = '5';

}


/* CARREGAR ANÚNCIOS */

async function carregarAnunciosPainel() {

  const {
    data,
    error
  } =
    await db
      .from('anuncios')
      .select('*')
      .order(
        'created_at',
        {
          ascending: false
        }
      );


  if (error) {

    console.error(
      'Erro ao carregar anúncios:',
      error
    );

    return [];
  }


  return data || [];

}


/* MOSTRAR ANÚNCIOS */

async function mostrarAnuncios() {

  const lista =
    document
      .getElementById(
        'listaAnuncios'
      );


  if (
    lista.style.display === 'block'
  ) {

    lista.style.display = 'none';

    return;
  }


  lista.style.display = 'block';

  lista.innerHTML =
    '<p>Carregando...</p>';


  const anuncios =
    await carregarAnunciosPainel();


  lista.innerHTML = '';


  if (
    anuncios.length === 0
  ) {

    lista.innerHTML =
      '<p>Nenhum anúncio cadastrado.</p>';

    return;
  }


  anuncios.forEach(
    anuncio => {

      const card =
        document
          .createElement('div');


      card.className =
        'anuncio-item';


      const nome =
        document
          .createElement('strong');


      nome.textContent =
        anuncio.nome ||
        'Sem nome';


      const tipo =
        document
          .createElement('p');


      tipo.textContent =
        'Tipo: ' +
        anuncio.tipo;


      const duracao =
        document
          .createElement('p');


      if (
        anuncio.tipo === 'imagem' &&
        anuncio.duracao
      ) {

        duracao.textContent =
          'Duração: ' +
          anuncio.duracao / 1000 +
          ' segundos';

      } else {

        duracao.textContent =
          'Duração: vídeo completo';

      }


      const status =
        document
          .createElement('p');


      status.className =
        'ativo';


      status.textContent =
        anuncio.ativo
          ? '● Ativo'
          : '● Inativo';


      card.appendChild(nome);
      card.appendChild(tipo);
      card.appendChild(duracao);
      card.appendChild(status);


      lista.appendChild(card);

    }
  );

}

</script>

</body>
</html>
