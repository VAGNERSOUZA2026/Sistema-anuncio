<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Player de Anúncios</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #player {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    #player img,
    #player video {
      width: 100%;
      height: 100%;
      object-fit: contain; /* se quiser preencher tudo, troque para cover */
      background: #000;
      display: block;
    }

    .mensagem {
      color: white;
      font-size: 24px;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>
<body>

  <div id="player">
    <div class="mensagem">Carregando anúncios...</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://brqdnhqifzlqktxvvltb.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJycWRuaHFpZnpscWt0eHZ2bHRiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxOTc0NDgsImV4cCI6MjEwNTc3MzQ0OH0.K74Qm65r5UuyWy1BUG3RVDzqV6YzJfk7WMDdhz9_lnw';

    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const player = document.getElementById('player');
    let anuncios = [];
    let atual = 0;
    let timer = null;

    function limparPlayer() {
      if (timer) {
        clearTimeout(timer);
        timer = null;
      }
      player.innerHTML = '';
    }

    function montarUrlArquivo(arquivo) {
      if (!arquivo) return '';

      if (arquivo.startsWith('http://') || arquivo.startsWith('https://')) {
        return arquivo;
      }

      return `${SUPABASE_URL}/storage/v1/object/public/midias/${arquivo}`;
    }

    function proximo() {
      if (!anuncios.length) {
        limparPlayer();
        player.innerHTML = '<div class="mensagem">Nenhum anúncio ativo encontrado.</div>';
        return;
      }

      if (atual >= anuncios.length) {
        atual = 0;
      }

      const anuncio = anuncios[atual];
      limparPlayer();

      const tipo = (anuncio.tipo || '').toLowerCase();
      const arquivo = montarUrlArquivo(anuncio.arquivo);

      if (!arquivo) {
        atual++;
        proximo();
        return;
      }

      if (tipo === 'video') {
        const video = document.createElement('video');
        video.src = arquivo;
        video.autoplay = true;
        video.muted = true;
        video.playsInline = true;
        video.controls = false;

        video.onended = () => {
          atual++;
          proximo();
        };

        video.onerror = () => {
          atual++;
          proximo();
        };

        player.appendChild(video);
      } else {
        const img = document.createElement('img');
        img.src = arquivo;
        img.alt = anuncio.nome || 'Anúncio';

        img.onerror = () => {
          atual++;
          proximo();
        };

        player.appendChild(img);

        const duracao = Number(anuncio.duracao) > 0 ? Number(anuncio.duracao) : 5;

        timer = setTimeout(() => {
          atual++;
          proximo();
        }, duracao * 1000);
      }
    }

    async function carregarAnuncios() {
      const { data, error } = await db
        .from('anuncios')
        .select('*')
        .eq('ativo', true)
        .order('created_at', { ascending: true });

      if (error) {
        console.error('Erro ao carregar anúncios:', error);
        limparPlayer();
        player.innerHTML = '<div class="mensagem">Erro ao carregar anúncios.</div>';
        return;
      }

      anuncios = data || [];
      atual = 0;

      console.log('Anúncios carregados:', anuncios);
      proximo();
    }

    carregarAnuncios();

    // atualiza a lista periodicamente
    setInterval(() => {
      carregarAnuncios();
    }, 60000);
  </script>
</body>
</html>
